services:
  - type: web
    name: stock-dashboard
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn stock_trading_system:app -c gunicorn.conf.py
    plan: free
    envVars:
      - key: PYTHON_VERSION
        value: 3.10.0
      # AI provider keys — failover chain (Gemini → Groq → Cerebras).
      # At least one must be set. Setting all three gives maximum headroom
      # and effectively eliminates rate-limiting under normal traffic.
      - key: GEMINI_API_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: CEREBRAS_API_KEY
        sync: false
      # Optional model overrides. Set one of these if a provider retires the
      # baked-in default; no redeploy of code is needed, just the env var.
      # Current defaults, all on their provider's free tier:
      #   GROQ_MODEL      openai/gpt-oss-120b  (30 RPM, 1k RPD, 8k TPM, 200k TPD)
      #   CEREBRAS_MODEL  gpt-oss-120b         (1M tokens/day, 8k context cap)
      #   GEMINI_MODEL    gemini-3.8-flash     (~20 RPD free, hence last in chain)
      - key: GEMINI_MODEL
        sync: false
      - key: GROQ_MODEL
        sync: false
      - key: CEREBRAS_MODEL
        sync: false
      # Optional cache TTL for repeated identical questions (default 300 s)
      - key: AGENT_CACHE_TTL_SEC
        sync: false
      - key: GNEWS_API_KEY
        sync: false
